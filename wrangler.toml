name = "cpns-simulasi"
main = "worker/index.ts"
compatibility_date = "2026-11-16"

routes = [
  { pattern = "cpns.imambas.my.id", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cpns-db"
database_id = "2518ae48-b8e9-404d-8614-350b4f03ceac"
